<!DOCTYPE html> 
<html> 
<head> 
<title>Event Handling Example</title> 
 
<style> 
 
body{ 
    font-family:"Times New Roman"; 
    text-align:center; 
    background-color:#f2f2f2; 
} 
 
.container{ 
    margin-top:80px; 
} 
 
button{ 
    padding:10px 20px; 
    font-size:16px; 
    margin:10px; 
    cursor:pointer; 
} 
 
#message{ 
    font-size:20px; 
    color:blue; 
    margin-top:20px; 
} 
 
</style> 
 
<script> 
 
function showMessage(){ 
document.getElementById("message").innerHTML= 
83  
"Button Click Event Triggered!"; 
} 
function changeColor(){ 
document.body.style.backgroundColor="lightyellow"; 
} 
function resetColor(){ 
document.body.style.backgroundColor="#f2f2f2"; 
} 
</script> 
</head> 
<body> 
<div class="container"> 
<h2>JavaScript Event Handling</h2> 
<button onclick="showMessage()">Click Me</button> 
<button onmouseover="changeColor()"  
onmouseout="resetColor()"> 
Hover Over Me 
</button> 
<p id="message"></p> 
</div> 
</body> 
</html>
